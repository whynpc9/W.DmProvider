name: R1 offline contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Initialize offline result path
        shell: bash
        run: printf 'R1_RESULTS_DIR=%s/r1-offline\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # verified v4
        with:
          global-json-file: global.json
      - name: Run all eight offline suites
        run: bash eng/t12-offline.sh offline
      - name: Verify missing release environment fails closed
        if: always()
        shell: bash
        run: |
          set +e
          env -u DAMENG_TEST_CONNECTION_STRING bash eng/t12-offline.sh release-environment
          code=$?
          set -e
          if [[ "$code" != 66 ]]; then
            printf 'release_environment_guard_wrong_exit\n' >&2
            exit 1
          fi
      - name: Preserve safe contracts and dependency results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: r1-offline-contracts
          path: ${{ env.R1_RESULTS_DIR }}/*/public/
          if-no-files-found: error
          retention-days: 14
