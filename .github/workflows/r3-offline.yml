name: R3 offline scoped contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r3-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Initialize isolated result directory
        shell: bash
        run: printf 'R3_RESULTS_DIR=%s/r3-offline\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run pure Python T19 tool contracts
        run: python3 -B -m unittest discover -s tools/DownstreamAcceptance/T19 -p 'test_*.py'
      - name: Run exact twelve suites and isolated first initialization faults
        run: bash eng/t18.sh offline
      - name: Verify missing TEST and TLS release environment fails closed
        if: always()
        shell: bash
        run: |
          set +e
          env -u DAMENG_TEST_CONNECTION_STRING -u DAMENG_TLS_TEST_CONNECTION_STRING bash eng/t18.sh release-environment
          code=$?
          set -e
          test "$code" = 66
      - name: Preserve only safe hashes, dependency trees and sanitized results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r3-offline-scoped-contracts
          path: ${{ env.R3_RESULTS_DIR }}/*/public/
          if-no-files-found: error
          retention-days: 14
