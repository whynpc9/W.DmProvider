name: R3 immutable candidate audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r3-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Isolate candidate artifacts
        run: printf 'R19_RESULTS_DIR=%s/r3-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Candidate failure evidence contracts
        run: python3 -B -m unittest discover -s tools/R3CandidateGate -p test_failure_evidence.py
      - name: Source identity contracts
        run: python3 -B -m unittest discover -s tools/R3ResourceProbe -p test_source_identity.py
      - name: Freeze full current source and audit immutable offline candidate
        run: bash eng/t19.sh offline
      - name: Missing release database environment fails closed
        if: always()
        shell: bash
        run: |
          set +e
          env -u DAMENG_TEST_CONNECTION_STRING -u DAMENG_TLS_TEST_CONNECTION_STRING bash eng/t19.sh release-environment
          code=$?
          set -e
          test "$code" = 66
      - name: Upload safe candidate source, identities and dependency audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r3-immutable-candidate-audit
          path: ${{ env.R19_RESULTS_DIR }}/*/public/
          if-no-files-found: error
          retention-days: 14
